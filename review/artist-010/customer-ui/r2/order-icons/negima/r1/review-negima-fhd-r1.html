<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Negima order icon R1 review</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #201914; }
      main {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background-color: #201914;
        background-image:
          linear-gradient(45deg, #2b211b 25%, transparent 25%),
          linear-gradient(-45deg, #2b211b 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #2b211b 75%),
          linear-gradient(-45deg, transparent 75%, #2b211b 75%);
        background-size: 32px 32px;
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
      }
      img { width: 384px; height: 384px; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <main aria-label="네기마 꼬치 단일 투명 에셋 격리 검수판">
      <img src="assets/order-icon-negima-r1.png" alt="네기마 꼬치 주문 아이콘">
    </main>
  </body>
</html>
