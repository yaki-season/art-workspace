<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customer order panel integration R3 — draft beer complete</title>
    <link rel="stylesheet" href="css/order-panel-integration-r3.css">
  </head>
  <body>
    <main class="review-canvas" aria-label="손님 주문 패널 통합 검수: 생맥주 완료, 네기마 대기 중">
      <div class="customer-order-anchor" style="--customer-x: 784px; --customer-y: 258px;">
        <section class="customer-order-wait-panel" aria-label="손님 주문 부분 완료 상태" style="--wait-progress: 62%;">
          <img class="customer-order-wait-panel__skin" src="../../wait-timer/r3/assets/customer-order-wait-panel-skin-r3.png" alt="">
          <div class="order-items" aria-label="주문 항목">
            <span class="order-item" aria-label="대기 중인 네기마 1개">
              <img class="order-item__icon" src="../../order-icons/negima/r1/assets/order-icon-negima-r1.png" alt="네기마">
              <b aria-label="수량 1">x1</b>
            </span>
            <span class="order-item" aria-label="완료된 생맥주 1잔">
              <i class="order-item__complete" aria-hidden="true"></i>
              <b aria-label="수량 1">x1</b>
            </span>
          </div>
          <div class="wait-gauge" role="progressbar" aria-label="서빙 대기 시간" aria-valuemin="0" aria-valuemax="100" aria-valuenow="62">
            <span class="wait-gauge__fill"></span>
            <span class="wait-gauge__a11y">서빙 대기 시간 62퍼센트 남음</span>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
