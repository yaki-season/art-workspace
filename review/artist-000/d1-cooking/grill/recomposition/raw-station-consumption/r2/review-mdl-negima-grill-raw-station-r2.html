  <main id="review" aria-label="D1 large raw negima station consumption review">

<script type="importmap">{"imports":{"three":"/app/node_modules/three/build/three.module.js"}}</script>
<script type="module">
  import * as THREE from "three";
  import { composeMdlNegimaGrillRaw, NEGIMA_GRILL_RAW_TRIANGLES } from "../../../raw-negima/r1/runtime/compose-mdl-negima-grill-raw.mjs";

  const query = new URLSearchParams(location.search);
  const viewport = query.get("viewport") === "720" ? { width: 1280, height: 720 } : { width: 1920, height: 1080 };
  const verticalScale = query.get("stretchY") === "1.18" ? 1.18 : 1;
  const { width, height } = viewport;
  for (const element of [document.documentElement, document.body, document.querySelector("#review"), document.querySelector("#base"), document.querySelector("#models")]) {
    element.style.width = `${width}px`;
    element.style.height = `${height}px`;
  }
  const canvas = document.querySelector("#models");
  canvas.width = width;
  canvas.height = height;
  await document.querySelector("#base").decode();

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false, preserveDrawingBuffer: true });
  renderer.setSize(width, height, false);
  renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(0, width, height, 0, 0.1, 100);
  camera.position.z = 50;
  const scale = width / 1920;
  const { root, flipPivot } = await composeMdlNegimaGrillRaw({ skewerScale: 270 * scale });
  // The single skewer occupies a full vertical grill lane. +Y maps upward in this camera.
  root.position.set(609.6 * scale, 565 * scale, 0);
  root.scale.set(1.45, verticalScale, 1);
  root.rotation.set(-0.035, 0.055, 0);
  root.traverse((node) => {
    if (!node.isMesh || !node.material) return;
    for (const material of (Array.isArray(node.material) ? node.material : [node.material])) {
      // Source albedo bytes remain unchanged; this is only station lighting multiplication.
      if (material.color) material.color.setRGB(1.0, 0.94, 0.86);
      material.side = THREE.DoubleSide;
      material.needsUpdate = true;
    }
  });
  scene.add(root);
  scene.updateMatrixWorld(true);
  renderer.render(scene, camera);

  const gl = renderer.getContext();
  const pixels = new Uint8Array(width * height * 4);
  gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  let minX = width, minY = height, maxX = -1, maxY = -1;
  for (let y = 0; y < height; y += 1) for (let x = 0; x < width; x += 1) {
    if (pixels[(y * width + x) * 4 + 3] === 0) continue;
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
  const renderedAlphaBBox = maxX < minX ? null : { x: minX, y: height - 1 - maxY, width: maxX - minX + 1, height: maxY - minY + 1 };
  window.__rawStationConsumption = {
    state: () => ({
      id: "MDL-NEGIMA-GRILL-RAW", sourceRevision: 1, triangleCount: NEGIMA_GRILL_RAW_TRIANGLES,
      flipPivot: { axis: "local +Y", rotationY: flipPivot.rotation.y, firstInput: "0->PI", secondInput: "PI->2PI" },
      gameplay: { frontElapsedSec: 0, backElapsedSec: 0, contactFace: null, qualityOwner: "game domain" },
      camera: { sourceMasterId: "CM-GRILL-STATION-QUEUED-SELECTION", sourceRevision: 3, projection: "approved master-derived fixed screen-space overlay", rootRotationRadians: { x: -0.035, y: 0.055, z: 0 } },
      legacySlot0VisualRect: { x: 0.297 * width, y: 0.435 * height, width: 0.041 * width, height: 0.27 * height },
      laneAnchor: { x: 0.3175 * width, y: 0.4768518519 * height },
      transform: { horizontalScale: 1.45, verticalScale },
      renderedAlphaBBox,
      renderer: { newRaster: false, newGlb: false, newTexture: false, nearestAlbedosReused: true }
    })
  };
  document.body.dataset.ready = "true";
</script>
