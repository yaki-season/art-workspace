<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D1 customer order — all waiting review R1</title>
    <link rel="stylesheet" href="review-d1-customer-order-all-waiting-fhd-r1.css">
  </head>
  <body>
    <main class="customer-service" aria-label="D1 츠키오카 주문 접수 화면, 네기마 세 개와 생맥주 한 잔 모두 대기 중">
      <img class="scene-base" src="source/d1-customer-service-model-source-r1.png" alt="밤 골목이 보이는 가게 안쪽에서 츠키오카가 단일 바 카운터 너머 왼쪽 좌석에 앉아 있다">

      <div class="customer-order-anchor" style="--customer-x: 334px; --customer-y: 292px;">
        <section class="customer-order-wait-panel" aria-label="D1-ORDER-001 주문 대기 상태" style="--wait-progress: 100%;">
          <img class="customer-order-wait-panel__skin" src="../../../../artist-010/customer-ui/r2/wait-timer/r3/assets/customer-order-wait-panel-skin-r3.png" alt="">
          <div class="order-items" aria-label="미수령 주문 항목">
            <span class="order-item" aria-label="대기 중인 네기마 세 개">
              <img class="order-item__icon" src="../../../../artist-010/customer-ui/r2/order-icons/negima/r1/assets/order-icon-negima-r1.png" alt="네기마">
              <b aria-label="수량 3">x3</b>
            </span>
            <span class="order-item" aria-label="대기 중인 생맥주 한 잔">
              <img class="order-item__icon" src="../../../../artist-010/customer-ui/r2/order-icons/draft-beer/r1/assets/order-icon-draft-beer-r1.png" alt="생맥주">
              <b aria-label="수량 1">x1</b>
            </span>
          </div>
          <div class="wait-gauge" role="progressbar" aria-label="서빙 대기 시간" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <span class="wait-gauge__fill"></span>
            <span class="sr-only">서빙 대기 시간 전체 남음</span>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
