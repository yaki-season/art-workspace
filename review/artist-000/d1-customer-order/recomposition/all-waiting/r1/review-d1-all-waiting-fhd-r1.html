<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, initial-scale=1">
    <title>D1 all waiting recomposition R1</title>
    <link rel="stylesheet" href="review-d1-all-waiting-fhd-r1.css">
  </head>
  <body>
    <main class="screen" aria-label="D1 주문 접수 직후: 네기마 세 개와 생맥주 한 잔 모두 대기">
      <img class="background" src="../../../../../artist-010/complete-layers/background/r3/background-complete-fhd-r3.png" alt="">
      <img class="customer" src="../../../complete-layers/d1-tsukioka/waiting/r2/assets/d1-tsukioka-waiting-complete-fhd-r2.png" alt="대기 중인 츠키오카">
      <img class="service-table" src="../../../complete-layers/table/r1/assets/service-table-complete-fhd-r1.png" alt="">

      <div class="order-anchor" style="--customer-x:1085px; --customer-y:210px;">
        <section class="order-panel" style="--wait-progress:100%" aria-label="D1-ORDER-001 주문 대기">
          <img class="panel-skin" src="../../../../../artist-010/customer-ui/r2/wait-timer/r3/assets/customer-order-wait-panel-skin-r3.png" alt="">
          <div class="order-items">
            <span class="order-item"><img src="../../../../../artist-010/customer-ui/r2/order-icons/negima/r1/assets/order-icon-negima-r1.png" alt="네기마"><b>x3</b></span>
            <span class="order-item"><img src="../../../../../artist-010/customer-ui/r2/order-icons/draft-beer/r1/assets/order-icon-draft-beer-r1.png" alt="생맥주"><b>x1</b></span>
          </div>
          <div class="wait-gauge" role="progressbar" aria-label="서빙 대기 시간" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span></span></div>
        </section>
      </div>

      <div class="station-nav-clip" aria-label="공통 스테이션 전환 UI"><iframe src="../../../../../artist-009/customer-screen/r3/composite.html" title="승인된 스테이션 전환 UI"></iframe></div>
    </main>
  </body>
</html>
